<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marouthèque</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
html { color-scheme: light dark; }
body { margin: 0; }
/* Concept : un catalogue dense à gauche, filtres en tête, statistiques dans un second onglet. */
:root {
  --bg: #eff0f4;
  --surface: #ffffff;
  --surface-2: #e6e8ee;
  --fg: #14161c;
  --muted: #5c6270;
  --line: #d6d9e1;
  --accent: #b5e61d;
  --accent-ink: #1a2300;
  --accent-text: #466400;
  --fav: #e5a100;
  --tile-l: 84%;
  --tile-ink: 24%;
  --font-display: "Chakra Petch", system-ui, sans-serif;
  --font-body: "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f14;
    --surface: #161a22;
    --surface-2: #1e232d;
    --fg: #eceef3;
    --muted: #9099a8;
    --line: #2a303c;
    --accent: #c6f432;
    --accent-ink: #1a2300;
    --accent-text: #c6f432;
    --fav: #ffc21a;
    --tile-l: 26%;
    --tile-ink: 82%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f14;
  --surface: #161a22;
  --surface-2: #1e232d;
  --fg: #eceef3;
  --muted: #9099a8;
  --line: #2a303c;
  --accent: #c6f432;
  --accent-ink: #1a2300;
  --accent-text: #c6f432;
  --fav: #ffc21a;
  --tile-l: 26%;
  --tile-ink: 82%;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.45;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent-text); outline-offset: 2px; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
h1 { font-family: var(--font-display); font-size: 2.2rem; line-height: 1; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 6px 0 0; }
.progress { min-width: 220px; flex: 1 1 260px; max-width: 420px; }
.progress .top { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.progress .top b { color: var(--fg); font-family: var(--font-display); font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 14px; font-weight: 600; color: var(--muted); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }

.tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; align-items: center; }
.tools .search { grid-column: 1 / -1; }
.field { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; min-width: 0; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.countline { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--surface); border: 0; padding: 5px 10px; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

.add { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; align-items: end; }
.add label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 10px 14px; font-weight: 600; }

.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.list.rows { grid-template-columns: 1fr; }
.card { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.card.is-done { border-color: var(--accent-text); }
.tile { width: 56px; height: 56px; border-radius: 8px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem;
  background: hsl(var(--h) 50% var(--tile-l)); color: hsl(var(--h) 45% var(--tile-ink)); }
.info { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.info h3 { margin: 0; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.meta { margin: 0; color: var(--muted); font-size: 12px; }
.plats { display: flex; flex-wrap: wrap; gap: 4px; }
.plat { font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; background: var(--surface-2); color: var(--muted); padding: 1px 6px; border-radius: 4px; }
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 2px; }
.ctl select { background: var(--surface-2); border: 0; border-radius: 6px; padding: 4px 6px; font-size: 12px; }
.stars { display: inline-flex; }
.stars button { background: none; border: 0; padding: 0 1px; font-size: 15px; line-height: 1; color: var(--line); }
.stars button.on { color: var(--fav); }
.side { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.chk, .fav, .del { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; line-height: 1; }
.chk[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.fav { color: var(--muted); }
.fav[aria-pressed="true"] { color: var(--fav); border-color: var(--fav); }
.del { font-size: 13px; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 40px 12px; border: 1px dashed var(--line); border-radius: 10px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.kpi span { display: block; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.kpi b { font-family: var(--font-display); font-size: 1.8rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-size: 1rem; margin: 0 0 10px; }
.row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 52px; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
.row .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.track { height: 12px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.track > i { display: block; height: 100%; background: var(--line); position: relative; }
.track > i > u { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.stack { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--surface-2); margin-bottom: 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; }
.top li { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.top { list-style: none; margin: 0; padding: 0; }
.note { color: var(--muted); font-size: 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font-weight: 500; }
.btn:hover { border-color: var(--accent-text); }
.titlebtn { background: none; border: 0; padding: 0; text-align: left; font: inherit; font-weight: 600; color: inherit; }
.titlebtn:hover { color: var(--accent-text); text-decoration: underline; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 10px; background: var(--accent); color: var(--accent-ink); border-radius: 4px; padding: 1px 6px; font-weight: 600; }
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.55); display: flex; justify-content: center; overflow-y: auto;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; width: 100%; max-width: 520px; padding: 18px; display: flex; flex-direction: column; gap: 14px; margin: auto; }
.sheet h2 { font-family: var(--font-display); font-size: 1.3rem; margin: 0; overflow-wrap: anywhere; }
.sheet .head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.sheet .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.sheet label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.sheet textarea { min-height: 84px; resize: vertical; }
.colchecks { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; }
.colitem { display: inline-flex; align-items: center; gap: 4px; }
.colitem label { flex-direction: row; align-items: center; gap: 6px; color: var(--fg); font-size: 13px; }
.del.mini { width: 22px; height: 22px; font-size: 11px; border-radius: 6px; }
.addcol { display: flex; gap: 8px; margin-top: 8px; }
.mates { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.mates .btn { font-size: 12px; padding: 4px 8px; }
.goal { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; margin-bottom: 10px; font-size: 13px; }
.goal.ok b { color: var(--accent-text); }
.goal .bar { grid-column: 1 / -1; height: 6px; }
.kpi b.small { font-size: 1.05rem; display: block; padding-top: 6px; overflow-wrap: anywhere; }
.summary { white-space: pre-wrap; background: var(--surface-2); border-radius: 8px; padding: 10px; font-family: var(--font-body); font-size: 13px; margin: 0 0 10px; overflow-wrap: anywhere; }
.cmp p { margin: 10px 0 0; }
@media (max-width: 520px) { .list { grid-template-columns: 1fr; } .row { grid-template-columns: 80px minmax(0,1fr) 46px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Marouthèque</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="progress">
      <div class="top"><span>Jeux terminés</span><b id="pCount">0 / 0</b></div>
      <div class="bar"><i id="pBar" style="width:0%"></i></div>
    </div>
  </header>

  <div class="actions">
    <button class="btn" id="surpriseBtn" type="button">🎲 Surprends-moi</button>
    <button class="btn" id="exportBtn" type="button">Exporter ma liste</button>
    <button class="btn" id="importBtn" type="button">Importer une liste</button>
    <button class="btn" id="themeBtn" type="button">Thème : auto</button>
    <input type="file" id="impFile" accept=".json,application/json" hidden>
  </div>
  <div class="add" id="impBar" hidden>
    <span id="impMsg"></span>
    <button class="primary" id="impMerge" type="button">Fusionner</button>
    <button class="btn" id="impReplace" type="button">Remplacer ma liste</button>
    <button class="btn" id="impCancel" type="button">Annuler</button>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabCat" aria-selected="true" aria-controls="viewCat" type="button">Catalogue</button>
    <button class="tab" role="tab" id="tabStats" aria-selected="false" aria-controls="viewStats" type="button">Statistiques</button>
  </div>

  <section id="viewCat" role="tabpanel" aria-labelledby="tabCat" style="display:flex;flex-direction:column;gap:12px">
    <div class="tools">
      <input class="field search" id="q" type="search" placeholder="Rechercher un jeu (titre, genre, plateforme)" aria-label="Rechercher">
      <select class="field" id="fGenre" aria-label="Genre"></select>
      <select class="field" id="fPlat" aria-label="Plateforme"></select>
      <select class="field" id="fStatus" aria-label="Statut"></select>
      <select class="field" id="fSerie" aria-label="Série"></select>
      <select class="field" id="fDecade" aria-label="Décennie"></select>
      <select class="field" id="fCol" aria-label="Collection"></select>
      <select class="field" id="fOwn" aria-label="Possession"></select>
      <select class="field" id="fSort" aria-label="Tri"></select>
      <button class="chip" id="fFav" type="button" aria-pressed="false">★ Favoris</button>
      <button class="chip" id="addToggle" type="button" aria-expanded="false">+ Ajouter un jeu</button>
    </div>

    <form class="add" id="addForm" hidden>
      <label>Titre<input class="field" id="aTitle" required maxlength="80" placeholder="Nom du jeu"></label>
      <label>Année<input class="field" id="aYear" type="number" min="1950" max="2100" placeholder="2024"></label>
      <label>Genre<select class="field" id="aGenre"></select></label>
      <label>Plateforme<select class="field" id="aPlat"></select></label>
      <button class="primary" type="submit">Ajouter à ma liste</button>
    </form>

    <div class="countline">
      <span id="count"></span>
      <span>
        <span class="seg" role="group" aria-label="Affichage">
          <button type="button" id="vGrid" aria-pressed="true">Grille</button>
          <button type="button" id="vRows" aria-pressed="false">Liste</button>
        </span>
      </span>
    </div>
    <div class="list" id="list"></div>
  </section>

  <section id="viewStats" role="tabpanel" aria-labelledby="tabStats" hidden style="display:none;flex-direction:column;gap:12px"></section>

  <p class="note" id="saveNote"></p>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="head">
      <div><h2 id="mTitle"></h2><p class="meta" id="mMeta" style="margin:4px 0 0;color:var(--muted);font-size:12px"></p></div>
      <button class="btn" type="button" id="mClose" aria-label="Fermer la fiche">✕</button>
    </div>
    <div class="grid2">
      <label>Possession<select class="field" id="mOwn"></select></label>
      <label>Temps de jeu (heures)<input class="field" id="mHours" type="number" min="0" step="0.5" inputmode="decimal"></label>
      <label>Début<input class="field" id="mD1" type="date"></label>
      <label>Fin<input class="field" id="mD2" type="date"></label>
    </div>
    <label>Notes personnelles<textarea class="field" id="mNote" maxlength="1000" placeholder="Impressions, passages préférés, avancement…"></textarea></label>
    <div>
      <span style="font-size:12px;color:var(--muted)">Collections</span>
      <div class="colchecks" id="mCols"></div>
      <div class="addcol"><input class="field" id="mNewCol" maxlength="40" placeholder="Nouvelle collection (ex. À faire cet été)" aria-label="Nom de la nouvelle collection"><button class="btn" type="button" id="mAddCol">Créer</button></div>
    </div>
    <div id="mMatesWrap"><span style="font-size:12px;color:var(--muted)" id="mSerieName"></span><div class="mates" id="mMates"></div></div>
  </div>
</div>

    var seg = [["done", c.done], ["play", c.play], ["wish", c.wish], ["drop", c.drop], ["", none]];
    var stack = seg.map(function (s) { return '<i style="width:' + (total ? s[1] / total * 100 : 0) + "%;background:" + STATUS_COLOR[s[0]] + '"></i>'; }).join("");
    var names = { done: "Terminés", play: "En cours", wish: "À jouer", drop: "Abandonnés", "": "Sans statut" };
    var legend = seg.map(function (s) { return '<span><i style="background:' + STATUS_COLOR[s[0]] + '"></i>' + names[s[0]] + " " + s[1] + "</span>"; }).join("");

    var rated = games.filter(function (g) { return (S.u[g.id] || {}).r; }).sort(function (a, b) { return S.u[b.id].r - S.u[a.id].r || a.t.localeCompare(b.t, "fr"); }).slice(0, 8);
    var favs = games.filter(function (g) { return (S.u[g.id] || {}).f; }).sort(function (a, b) { return a.t.localeCompare(b.t, "fr"); }).slice(0, 8);
    function li(g, right) { return "<li><span>" + esc(g.t) + '</span><span class="note">' + right + "</span></li>"; }

    var goals =
      goal("Premier pas", "Terminer 1 jeu", c.done, 1) +
      goal("Dix de der", "Terminer 10 jeux", c.done, 10) +
      goal("Joueur assidu", "Terminer 25 jeux", c.done, 25) +
      goal("Demi-centenaire", "Terminer 50 jeux", c.done, 50) +
      goal("Centenaire", "Terminer 100 jeux", c.done, 100) +
      goal("Fan de RPG", "Terminer 10 RPG", doneG["RPG"] || 0, 10) +
      goal("Un jeu par décennie", "Au moins un jeu terminé dans chaque décennie", Object.keys(doneD).length, dRows.length) +
      goal("Touche-à-tout", "Terminer des jeux dans 8 genres", Object.keys(doneG).length, 8) +
      goal("Coup de cœur", "Mettre 5 jeux en favoris", c.fav, 5) +
      goal("Critique", "Noter 10 jeux", c.rated, 10) +
      goal("Organisé", "Créer 3 collections", S.cols.length, 3) +
      goal("Marathonien", "Cumuler 100 heures de jeu", c.h, 100);

    var summary = summaryText(games, c);

    $("viewStats").innerHTML =
      '<div class="kpis">' +
      '<div class="kpi"><span>Terminés</span><b>' + c.done + "</b></div>" +
      '<div class="kpi"><span>En cours</span><b>' + c.play + "</b></div>" +
      '<div class="kpi"><span>À jouer</span><b>' + c.wish + "</b></div>" +
      '<div class="kpi"><span>Favoris</span><b>' + c.fav + "</b></div>" +
      '<div class="kpi"><span>Note moyenne</span><b>' + (c.rated ? (c.sum / c.rated).toFixed(1) : "–") + "</b></div>" +
      '<div class="kpi"><span>Heures de jeu</span><b>' + (Math.round(c.h * 10) / 10) + "</b></div>" +
      '<div class="kpi"><span>Genre préféré</span><b class="small">' + esc(favG) + "</b></div></div>" +
      '<div class="panels">' +
      '<div class="panel"><h2>Répartition par statut</h2><div class="stack">' + stack + '</div><div class="legend">' + legend + "</div></div>" +
      '<div class="panel"><h2>Défis et badges</h2>' + goals + "</div>" +
      '<div class="panel"><h2>Mes mieux notés</h2>' + (rated.length ? '<ul class="top">' + rated.map(function (g) { return li(g, "★".repeat(S.u[g.id].r)); }).join("") + "</ul>" : '<p class="note">Attribuez des étoiles aux jeux pour les voir ici.</p>') + "</div>" +
      '<div class="panel"><h2>Mes favoris</h2>' + (favs.length ? '<ul class="top">' + favs.map(function (g) { return li(g, g.y || ""); }).join("") + "</ul>" : '<p class="note">Cliquez sur l’étoile d’un jeu pour l’ajouter ici.</p>') + "</div>" +
      '<div class="panel"><h2>Terminés par année</h2>' + (yRows.length ? bars(yRows) : '<p class="note">Cliquez sur le titre d’un jeu et renseignez sa date de fin pour alimenter ce graphique.</p>') + "</div>" +
      '<div class="panel"><h2>Par genre</h2>' + bars(gRows) + '<p class="note">Partie colorée : jeux terminés.</p></div>' +
      '<div class="panel"><h2>Par décennie</h2>' + bars(dRows) + "</div>" +
      '<div class="panel"><h2>Par plateforme</h2>' + bars(pRows) + "</div>" +
      '<div class="panel"><h2>Comparer avec un ami</h2>' + cmpPanel(games) + "</div>" +
      '<div class="panel"><h2>Mon résumé à partager</h2><pre class="summary" id="sumText">' + esc(summary) + '</pre><button class="btn" type="button" data-act="copy">Copier le résumé</button></div></div>';
  }

  function render() { renderHeader(); renderList(); if (!$("viewStats").hidden) renderStats(); }
  var rt = null;
  function renderSoon() { clearTimeout(rt); rt = setTimeout(render, 250); }

  /* ---------- fiche d'un jeu ---------- */
  var openId = null;
  function renderModalCols() {
    var c = (S.u[openId] || {}).c || [];
    $("mCols").innerHTML = S.cols.length ? S.cols.map(function (k) {
      return '<span class="colitem"><label><input type="checkbox" data-col="' + k.id + '"' + (c.indexOf(k.id) >= 0 ? " checked" : "") + "> " + esc(k.n) + '</label><button type="button" class="del mini" data-delcol="' + k.id + '" aria-label="Supprimer la collection ' + esc(k.n) + '">✕</button></span>';
    }).join("") : '<span class="note">Aucune collection. Créez-en une ci-dessous.</span>';
  }
  function renderMates(g) {
    var mates = g.s ? allGames().filter(function (x) { return x.s === g.s && x.id !== g.id; }).sort(function (a, b) { return a.y - b.y; }).slice(0, 14) : [];
    $("mMatesWrap").hidden = !mates.length;
    $("mMates").innerHTML = mates.map(function (x) { return '<button type="button" class="btn" data-mate="' + x.id + '">' + esc(x.t) + "</button>"; }).join("");
    $("mSerieName").textContent = g.s ? "Même série : " + g.s : "";
  }
  function openModal(id) {
    var g = gameById(id); if (!g) return;
    openId = id; var u = S.u[id] || {};
    $("mTitle").textContent = g.t;
    $("mMeta").textContent = (g.y ? g.y + " · " : "") + g.g + " · " + platNames(g);
    $("mOwn").value = u.o || ""; $("mHours").value = u.h || ""; $("mD1").value = u.d1 || ""; $("mD2").value = u.d2 || ""; $("mNote").value = u.n || "";
    renderModalCols(); renderMates(g);
    $("modal").hidden = false; $("mClose").focus();
  }
  function closeModal() { $("modal").hidden = true; openId = null; render(); }
  function saveField(k, v) {
    if (!openId) return;
    var u = entry(openId);
    if (v === "" || v == null) delete u[k]; else u[k] = v;
    clean(openId); touch(); renderSoon();
  }
  function refreshFilters() {
    var games = allGames(), counts = {};
    games.forEach(function (g) { if (g.s) counts[g.s] = (counts[g.s] || 0) + 1; });
    var series = Object.keys(counts).filter(function (k) { return counts[k] >= 2; }).sort(function (a, b) { return a.localeCompare(b, "fr"); });
    var decs = {}; games.forEach(function (g) { if (g.y) decs[Math.floor(g.y / 10) * 10] = 1; });
    keep($("fSerie"), "Toutes les séries", series.map(function (s) { return [s, s]; }), "serie");
    keep($("fDecade"), "Toutes les décennies", Object.keys(decs).sort().map(function (d) { return [d, d + "s"]; }), "decade");
    keep($("fCol"), "Toutes les collections", S.cols.map(function (k) { return [k.id, k.n]; }), "col");
  }
  function keep(sel, first, items, key) {
    var cur = sel.value;
    fill(sel, first, items);
    sel.value = items.some(function (i) { return String(i[0]) === cur; }) ? cur : "";
    F[key] = sel.value;
  }

  /* ---------- événements : liste ---------- */
  $("list").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT") return;
    var act = b.getAttribute("data-act"), id = b.getAttribute("data-id"), u;
    if (act === "open") { openModal(id); return; }
    if (act === "done") { u = entry(id); u.s = u.s === "done" ? "" : "done"; if (!u.s) delete u.s; clean(id); }
    else if (act === "fav") { u = entry(id); u.f = u.f ? 0 : 1; if (!u.f) delete u.f; clean(id); }
    else if (act === "rate") { u = entry(id); var v = parseInt(b.getAttribute("data-v"), 10); u.r = u.r === v ? 0 : v; if (!u.r) delete u.r; clean(id); }
    else if (act === "del") { S.custom = S.custom.filter(function (c) { return c.id !== id; }); delete S.u[id]; refreshFilters(); }
    touch(); render();
  });
  $("list").addEventListener("change", function (e) {
    var s = e.target.closest("select[data-act='status']"); if (!s) return;
    var id = s.getAttribute("data-id"), u = entry(id); u.s = s.value; if (!u.s) delete u.s; clean(id); touch(); render();
  });

  function fill(sel, first, items) {
    sel.innerHTML = '<option value="">' + first + "</option>" + items.map(function (i) { return '<option value="' + esc(i[0]) + '">' + esc(i[1]) + "</option>"; }).join("");
  }
  fill($("fGenre"), "Tous les genres", GENRES.map(function (g) { return [g, g]; }));
  fill($("fPlat"), "Toutes plateformes", Object.keys(PLAT).map(function (k) { return [k, PLAT[k]]; }));
  fill($("fStatus"), "Tous les statuts", [["wish", "À jouer"], ["play", "En cours"], ["done", "Terminé"], ["drop", "Abandonné"], ["none", "Sans statut"]]);
  fill($("fOwn"), "Toute possession", [["owned", "Possédé"], ["wanted", "Souhaité"], ["lent", "Prêté"], ["none", "Non précisé"]]);
  $("fSort").innerHTML = [["title", "Tri : titre A–Z"], ["year-desc", "Tri : plus récents"], ["year-asc", "Tri : plus anciens"], ["rating", "Tri : mieux notés"], ["hours", "Tri : temps de jeu"], ["status", "Tri : statut"], ["fav", "Tri : favoris d’abord"]]
    .map(function (o) { return '<option value="' + o[0] + '">' + o[1] + "</option>"; }).join("");
  $("aGenre").innerHTML = GENRES.map(function (g) { return "<option>" + g + "</option>"; }).join("");
  $("aPlat").innerHTML = Object.keys(PLAT).map(function (k) { return '<option value="' + k + '">' + PLAT[k] + "</option>"; }).join("");
  $("mOwn").innerHTML = OWN.map(function (o) { return '<option value="' + o[0] + '">' + o[1] + "</option>"; }).join("");

  var qt = null;
  $("q").addEventListener("input", function () { clearTimeout(qt); qt = setTimeout(function () { F.q = $("q").value; renderList(); }, 120); });
  var FILTERS = { fGenre: "genre", fPlat: "plat", fStatus: "status", fSerie: "serie", fDecade: "decade", fCol: "col", fOwn: "own", fSort: "sort" };
  Object.keys(FILTERS).forEach(function (id) { $(id).addEventListener("change", function () { F[FILTERS[id]] = this.value; renderList(); }); });
  $("fFav").addEventListener("click", function () { F.fav = !F.fav; this.setAttribute("aria-pressed", F.fav); renderList(); });
  $("vGrid").addEventListener("click", function () { F.view = "grid"; this.setAttribute("aria-pressed", "true"); $("vRows").setAttribute("aria-pressed", "false"); renderList(); });
  $("vRows").addEventListener("click", function () { F.view = "rows"; this.setAttribute("aria-pressed", "true"); $("vGrid").setAttribute("aria-pressed", "false"); renderList(); });

  $("addToggle").addEventListener("click", function () {
    var open = $("addForm").hidden; $("addForm").hidden = !open; this.setAttribute("aria-expanded", open);
    if (open) $("aTitle").focus();
  });
  $("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var t = $("aTitle").value.trim(); if (!t) return;
    var y = parseInt($("aYear").value, 10);
    S.custom.push({ id: "x" + Date.now().toString(36), t: t, y: isNaN(y) ? 0 : y, g: $("aGenre").value, p: $("aPlat").value });
    $("aTitle").value = ""; $("aYear").value = "";
    touch(); refreshFilters(); render();
  });

  /* ---------- événements : fiche ---------- */
  $("mClose").addEventListener("click", closeModal);
  $("modal").addEventListener("click", function (e) { if (e.target === $("modal")) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("modal").hidden) closeModal(); });
  $("mOwn").addEventListener("change", function () { saveField("o", this.value); });
  $("mHours").addEventListener("input", function () { var n = parseFloat(this.value); saveField("h", isNaN(n) || n <= 0 ? "" : Math.round(n * 2) / 2); });
  $("mD1").addEventListener("change", function () { saveField("d1", this.value); });
  $("mD2").addEventListener("change", function () { saveField("d2", this.value); });
  $("mNote").addEventListener("input", function () { saveField("n", this.value.trim() ? this.value : ""); });
  $("mCols").addEventListener("change", function (e) {
    var cb = e.target.closest("input[data-col]"); if (!cb || !openId) return;
    var u = entry(openId), id = cb.getAttribute("data-col"); u.c = u.c || [];
    var i = u.c.indexOf(id);
    if (cb.checked && i < 0) u.c.push(id);
    if (!cb.checked && i >= 0) u.c.splice(i, 1);
    if (!u.c.length) delete u.c;
    clean(openId); touch(); renderSoon();
  });
  $("mCols").addEventListener("click", function (e) {
    var b = e.target.closest("[data-delcol]"); if (!b) return;
    var id = b.getAttribute("data-delcol");
    S.cols = S.cols.filter(function (k) { return k.id !== id; });
    Object.keys(S.u).forEach(function (gid) {
      var u = S.u[gid]; if (!u.c) return;
      u.c = u.c.filter(function (x) { return x !== id; }); if (!u.c.length) delete u.c; clean(gid);
    });
    touch(); refreshFilters(); renderModalCols(); renderSoon();
  });
  function addCol() {
    var n = $("mNewCol").value.trim(); if (!n || !openId) return;
    var id = "c" + Date.now().toString(36);
    S.cols.push({ id: id, n: n.slice(0, 40) });
    var u = entry(openId); u.c = (u.c || []).concat(id);
    $("mNewCol").value = "";
    touch(); refreshFilters(); renderModalCols(); renderSoon();
  }
  $("mAddCol").addEventListener("click", addCol);
  $("mNewCol").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); addCol(); } });
  $("mMates").addEventListener("click", function (e) { var b = e.target.closest("[data-mate]"); if (b) openModal(b.getAttribute("data-mate")); });

  /* ---------- actions : thème, surprise, export, import ---------- */
  $("themeBtn").addEventListener("click", function () {
    var order = ["", "light", "dark"]; S.th = order[(order.indexOf(S.th || "") + 1) % 3];
    applyTheme(); touch();
  });

  $("surpriseBtn").addEventListener("click", function () {
    var games = allGames();
    var pool = games.filter(function (g) { return (S.u[g.id] || {}).s === "wish"; }), from = "votre liste « À jouer »";
    if (!pool.length) { pool = games.filter(function (g) { return !(S.u[g.id] || {}).s; }); from = "les jeux sans statut"; }
    if (!pool.length) { note("Tous vos jeux ont déjà un statut."); return; }
    var pick = pool[Math.floor(Math.random() * pool.length)];
    note("Suggestion tirée parmi " + from + ".");
    openModal(pick.id);
  });

  function anchorDownload(filename, text) {
    try {
      var url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
      var a = document.createElement("a"); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    } catch (e) { note("L’export n’est pas disponible ici."); }
  }
  $("exportBtn").addEventListener("click", function () {
    var text = JSON.stringify({ app: "marouthèque", exportedAt: new Date().toISOString(), data: S }, null, 2);
    var filename = "maroutheque-" + new Date().toISOString().slice(0, 10) + ".json";
    var via = window.claude && claude.use ? claude.use("downloads") : Promise.resolve(null);
    via.then(function (d) {
      if (d) return d.save({ filename: filename, data: text }).then(function () { note("Export enregistré."); });
      anchorDownload(filename, text);
    }).catch(function (err) { if (!err || err.code !== "declined") anchorDownload(filename, text); });
  });

  function parseBackup(text) {
    var o = JSON.parse(text), d = o && o.data ? o.data : o;
    if (!d || typeof d !== "object" || !d.u || typeof d.u !== "object") throw new Error("format");
    return normalize(d);
  }
  function readBackup(file, cb) {
    var r = new FileReader();
    r.onload = function () { try { cb(null, parseBackup(String(r.result))); } catch (e) { cb(e); } };
    r.onerror = function () { cb(new Error("lecture")); };
    r.readAsText(file);
  }
  function mergeInto(base, imp) {
    Object.keys(imp.u).forEach(function (id) {
      var a = base.u[id], b = imp.u[id];
      if (!a) { base.u[id] = b; return; }
      Object.keys(b).forEach(function (k) {
        if (k === "c") { var have = a.c || []; a.c = have.concat((b.c || []).filter(function (x) { return have.indexOf(x) < 0; })); }
        else if (!a[k]) a[k] = b[k];
      });
    });
    imp.custom.forEach(function (c) { if (!base.custom.some(function (x) { return x.id === c.id; })) base.custom.push(c); });
    imp.cols.forEach(function (c) { if (!base.cols.some(function (x) { return x.id === c.id; })) base.cols.push(c); });
  }
  var pendingImp = null;
  function endImport() { pendingImp = null; $("impBar").hidden = true; }
  function afterImport() { touch(); applyTheme(); refreshFilters(); render(); endImport(); }
  $("importBtn").addEventListener("click", function () { $("impFile").click(); });
  $("impFile").addEventListener("change", function () {
    var f = this.files && this.files[0], input = this; if (!f) return;
    readBackup(f, function (err, imp) {
      input.value = "";
      if (err) { note("Ce fichier n’est pas un export valide de la Marouthèque."); return; }
      pendingImp = imp;
      $("impMsg").textContent = "Fichier lu : " + Object.keys(imp.u).length + " jeux suivis, " + imp.cols.length + " collection(s). Que faire ?";
      $("impBar").hidden = false;
    });
  });
  $("impMerge").addEventListener("click", function () { if (pendingImp) { mergeInto(S, pendingImp); afterImport(); note("Liste fusionnée."); } });
  $("impReplace").addEventListener("click", function () { if (pendingImp) { S = pendingImp; afterImport(); note("Liste remplacée."); } });
  $("impCancel").addEventListener("click", endImport);

  /* ---------- événements : statistiques ---------- */
  $("viewStats").addEventListener("change", function (e) {
    if (!e.target || e.target.id !== "cmpFile") return;
    var f = e.target.files && e.target.files[0]; if (!f) return;
    readBackup(f, function (err, imp) {
      if (err) { note("Ce fichier n’est pas un export valide de la Marouthèque."); return; }
      CMP = imp; renderStats();
    });
  });
  $("viewStats").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act='copy']"); if (!b) return;
    var text = $("sumText").textContent;
    var done = function () { b.textContent = "Copié"; };
    try { navigator.clipboard.writeText(text).then(done, function () { var r = document.createRange(); r.selectNodeContents($("sumText")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Sélectionné : copiez avec Ctrl+C"; }); }
    catch (err) { b.textContent = "Sélectionnez le texte pour le copier"; }
  });

  function showTab(stats) {
    $("tabCat").setAttribute("aria-selected", !stats); $("tabStats").setAttribute("aria-selected", stats);
    $("viewCat").hidden = stats; $("viewCat").style.display = stats ? "none" : "flex";
    $("viewStats").hidden = !stats; $("viewStats").style.display = stats ? "flex" : "none";
    if (stats) renderStats();
  }
  $("tabCat").addEventListener("click", function () { showTab(false); });
  $("tabStats").addEventListener("click", function () { showTab(true); });

  /* ---------- démarrage ---------- */
  function initStore() {
    var local = loadLocal();
    if (local) S = normalize(local);
    applyTheme(); refreshFilters(); render(); noteIdle();
    if (!window.claude || !claude.use) return;
    Promise.all([claude.use("db"), claude.use("user")]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db || !user) return null;
      return user.id().then(function (id) {
        if (!id) return null;
        var doc = db.doc("data/users/" + id + "/library");
        return doc.get().then(function (snap) {
          dbDoc = doc;
          if (snap.exists) { S = normalize(snap.data()); saveLocal(); }
          applyTheme(); refreshFilters(); render(); noteIdle();
          if (!snap.exists && hasData()) flush();
        });
      });
    }).catch(function () {});
  }

  initStore();
})();
</script>

</body>
</html>
